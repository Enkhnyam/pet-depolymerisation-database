run_name: extract_mlarge

# Matrix cell: extraction by azure/Mistral-Large-3. Prompt, shots, seed and eval settings are identical across
# every model in the matrix, so the extractor is the only variable.
llm_params:
  model: azure/Mistral-Large-3
  api_key: ${azure_key}
  api_base: https://karim-api-resource.openai.azure.com
  api_version: "2024-12-01-preview"
  max_tokens: 8192

harness_params:
  prompt_file: extraction_prompt.txt
  output_dir: extract_mlarge
  curated_data_path: curated_data_json_by_doi.json
  curated_data_markdown_dir: curated_data_markdown_by_doi
  max_workers: 2
  n_shots: 4
  shot_selection: random
  seed: 123
  evaluation:
    curated_data_path: curated_table_final.json
    tp_threshold: 0.3
    catalyst_threshold: 0.6
    numeric_tolerance: 0.2
