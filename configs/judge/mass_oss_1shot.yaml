run_name: mass_oss_1shot

# The grader for the 1,027-paper, one-shot database run.
#
# Same pairing as mass_oss: gpt-oss-120b judging a luna extraction is what the agreement study
# settled on (0.914 on records the metric could evaluate), and it is the free half -- the RWTH
# endpoint is unmetered, so this costs wall time only.
#
# No curated table exists for this corpus, which is the point: the judge reads the paper and the
# record and needs no reference. Its verdicts are what cli/apply_fixes.py turns into the
# corrected database.
#
# Nothing here differs from mass_oss except extraction_run -- same rubric, same model, same
# corpus -- so the two judge runs are comparable and any difference in their verdicts is a
# difference in the extraction being graded, not in the grading.
llm_params:
  model: openai/gpt-oss-120b
  api_key: ${openai_key}
  api_base: https://chat.kiconnect.nrw/api/v1/
  # 8192 truncated an 80-record paper mid-JSON in the first run: the judge answers for every
  # record in one call, so the output budget has to scale with the longest record list, not with
  # a typical paper.
  max_tokens: 16384

harness_params:
  rubric_file: judge_rubric.txt
  extraction_run: mass_luna_1shot
  curated_data_markdown_dir: corpus_markdown
  output_dir: mass_oss_1shot
  # No max_workers: core.judge.run is a sequential loop and has never read it. mass_oss.yaml
  # carries one, which reads as though the judge fans out; it does not.
